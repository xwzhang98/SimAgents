name: SWIFT
description: "SWIFT (SPH With Inter-dependent Fine-grained Tasking) — a modern, task-based cosmological simulation code using YAML configuration."
family: swift
ic_generator: external
ic_note: "Use MUSIC/monofonIC to generate ICs. SWIFT reads box size from IC file."

units:
  length: Mpc
  mass: Msun
  velocity: km/s

output:
  format: yaml
  comment_prefix: "#"
  sections:
    - name: params
      description: "SWIFT YAML configuration parameters"
      filename_template: "{paper}_params.json"
      native_template: swift_params.yml.j2

parameter_names:
  matter_density: Omega_cdm
  dark_energy_density: Omega_lambda
  baryon_density: Omega_b
  hubble_parameter: h
  time_begin: a_begin
  time_end: a_end

validation:
  parameter_ranges:
    Omega_cdm: [0.2, 0.4]
    Omega_lambda: [0.6, 0.8]
    Omega_b: [0.02, 0.08]
    h: [0.5, 1.0]
  swap_detection:
    - pair: [Omega_cdm, Omega_lambda]
      rule: "Omega_cdm (matter) should be ~0.3, Omega_lambda (dark energy) should be ~0.7"
  large_value_corrections: []
  required_parameters:
    - Omega_cdm
    - Omega_b
    - Omega_lambda
    - h
